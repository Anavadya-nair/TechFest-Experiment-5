
name: TechFest CI Pipeline

on:
  push:
    branches:
      - main
      - feature/frontend
      - feature/backend
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm ci
        working-directory: techfest-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: techfest-react

      - name: Build React frontend
        run: npm run build
        working-directory: techfest-react
